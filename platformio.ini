; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = airm2m_core_esp32c3

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:airm2m_core_esp32c3]
platform = espressif32
board = airm2m_core_esp32c3
framework = arduino
monitor_speed = 115200

; The defs for an generic ESP32-C3 board off Aliexpress
; For example this one: https://www.aliexpress.com/item/1005005319963906.html
[env:generic_esp32c3]
platform = espressif32
board = esp32-c3-devkitc-02
board_build.flash_mode = dio
framework = arduino
monitor_speed = 115200
build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1  

; The defs for an generic ESP32-NodeMCU (ESP32S) board off Aliexpress
[env:generic_nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200

[env:m5stickc]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200

[env:esp32c5-n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino
monitor_speed = 115200

# Hardware Memory Configurations for N16R8 Variant
board_build.flash_size = 16MB
board_build.psram_type = opi
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags = 
    -D BOARD_ESP32C5DEVKIT1
    -D ARDUINO_VARIANT=esp32c5

